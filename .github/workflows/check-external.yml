name: External links

on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: python3 scripts/check-external.py _site
