title: Destiny Agent Grimoire
tagline: Canonical Destiny lore and agent personas
description: >-
  One canonical Destiny lore archive and the agents born from it.
url: "https://sagaciouszu.github.io"
baseurl: "/destiny-agent-grimoire"
timezone: UTC
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: "1,2,3"
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      permalink: /:basename/
