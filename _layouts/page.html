---
layout: default
---
<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <header class="mb-6">
    <h1 class="text-3xl sm:text-4xl font-display font-extrabold tracking-tight text-white">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="mt-3 text-lg text-slate-400">{{ page.subtitle }}</p>{% endif %}
  </header>
  <article class="prose prose-invert max-w-none">
    {{ content }}
  </article>
</section>
