<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/icons/destiny.svg' | relative_url }}">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gold: { 300:'#f5d98a', 400:'#f0c040', 500:'#d4af37', 600:'#b8922e', 700:'#8a6a1f' },
          panel: '#151a26',
          deep: '#0b0f19'
        },
        fontFamily: {
          sans: ['Neue Haas Grotesk Display Pro','Helvetica Neue','Helvetica','Arial','sans-serif'],
          display: ['Neue Haas Grotesk Display Pro','Helvetica Neue','Helvetica','Arial','sans-serif']
        }
      }
    }
  }
</script>
<link href="https://fonts.cdnfonts.com/css/neue-haas-grotesk-display-pro" rel="stylesheet">
